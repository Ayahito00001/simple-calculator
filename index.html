<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="シンプル電卓">


<title>シンプル電卓</title>
<style>
:root { color-scheme: light dark; --bg:#f7f7f7; --fg:#202124; --key:#e2e2e2; --op:#d4d4d4; --special:#383838; --specialfg:#fff; --line:#d0d0d0; }
@media (prefers-color-scheme: dark) { :root { --bg:#171717; --fg:#f4f4f4; --key:#303030; --op:#424242; --special:#f1f1f1; --specialfg:#171717; --line:#444; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; height:100dvh; min-height:100%; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
.top { display:flex; justify-content:space-between; padding:10px 16px; min-height:56px; align-items:center; }
.top button { border:0; background:transparent; color:var(--fg); font-size:25px; padding:8px; }
main { flex:1; min-height:0; display:flex; flex-direction:column; }
.display { flex:1; min-height:150px; display:flex; flex-direction:column; justify-content:flex-end; padding:16px 20px 24px; overflow:hidden; }
.expression { font-size:clamp(20px, 5.2vw, 30px); text-align:right; white-space:nowrap; overflow-x:auto; scrollbar-width:none; min-height:1.5em; }
.result { text-align:right; font-size:clamp(36px, 11vw, 54px); margin-top:22px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
.pad { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; padding:6px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
.key { border:0; border-radius:50%; aspect-ratio:1; background:var(--key); color:var(--fg); font-size:clamp(24px, 7vw, 38px); font-weight:400; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.key.op { background:var(--op); } .key.special { background:var(--special); color:var(--specialfg); }
.history { display:none; position:fixed; inset:0; background:var(--bg); z-index:2; padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); overflow:auto; }
.history.show { display:block; }
.history-head { display:flex; justify-content:space-between; align-items:center; font-size:22px; margin-bottom:16px; }
.history-item { padding:14px 4px; border-bottom:1px solid var(--line); text-align:right; }
.history-item .expr { font-size:15px; opacity:.75; overflow-wrap:anywhere; } .history-item .ans { font-size:24px; margin-top:4px; }
.small { font-size:14px; opacity:.65; }
</style>
</head>
<body>
<div class="top"><button id="historyBtn" aria-label="計算履歴">◴</button><button id="menuBtn" aria-label="メニュー">⋮</button></div>
<main>
 <section class="display"><div class="expression" id="expression"></div><div class="result" id="result">0</div></section>
 <section class="pad" id="pad">
  <button class="key special" data-action="clear">AC</button><button class="key" data-action="paren">()</button><button class="key" data-action="percent">%</button><button class="key op" data-op="÷">÷</button>
  <button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key op" data-op="×">×</button>
  <button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key op" data-op="−">−</button>
  <button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key op" data-op="+">+</button>
  <button class="key" data-num="0">0</button><button class="key" data-action="dot">.</button><button class="key" data-action="back">⌫</button><button class="key special" data-action="equals">=</button>
 </section>
</main>
<section class="history" id="history"><div class="history-head"><span>計算履歴</span><button id="closeHistory" class="key" style="width:48px;min-height:48px;aspect-ratio:1;font-size:22px">×</button></div><div id="historyList"></div><button id="clearHistory" style="margin-top:16px;padding:12px 18px;border:0;border-radius:12px">履歴を消去</button></section>
<script>
const $ = id => document.getElementById(id);
let expr = "", justEvaluated = false, history = [];
const fmt = n => { if (!Number.isFinite(n)) return "エラー"; const rounded = Math.abs(n) < 1e15 ? Number(n.toPrecision(12)) : n; return rounded.toLocaleString("en-US", {maximumFractionDigits:10}); };
function show() { $("expression").textContent = expr.replace(/\*/g,"×").replace(/\//g,"÷"); if (!expr) { $("result").textContent="0"; return; } try { $("result").textContent = fmt(calc(expr)); } catch { $("result").textContent = ""; } }
function calc(s) { if (!s.trim()) return 0; if (!/^[0-9+\-*/().%\s]+$/.test(s)) throw Error(); s = s.replace(/(\d+(?:\.\d+)?|\([^()]*\))%/g, "($1/100)"); if (!/^[0-9+\-*/().\s]+$/.test(s)) throw Error(); const v = Function('"use strict"; return (' + s + ')')(); if (typeof v !== "number" || !Number.isFinite(v)) throw Error(); return v; }
function addNum(n) { if (justEvaluated) { expr=""; justEvaluated=false; } expr += n; show(); }
function addOp(op) { justEvaluated=false; if (!expr && op !== "−") return; if (/[+\-*/]$/.test(expr)) expr=expr.slice(0,-1); expr += ({ "×":"*", "÷":"/", "−":"-" }[op] || op); show(); }
function equals() { if (!expr) return; try { const answer=calc(expr); history.unshift({expr:expr.replace(/\*/g,"×").replace(/\//g,"÷"), answer:fmt(answer)}); history=history.slice(0,100); renderHistory(); $("expression").textContent=expr.replace(/\*/g,"×").replace(/\//g,"÷")+" ="; expr=String(answer); $("result").textContent=fmt(answer); justEvaluated=true; } catch { $("result").textContent="エラー"; } }
function renderHistory() { $("historyList").innerHTML=""; if (!history.length) { $("historyList").innerHTML='<p class="small">履歴はありません</p>'; return; } history.forEach(item=>{ const d=document.createElement("div"); d.className="history-item"; const e=document.createElement("div"); e.className="expr"; e.textContent=item.expr; const a=document.createElement("div"); a.className="ans"; a.textContent=item.answer; d.append(e,a); d.addEventListener("click",()=>{expr=item.answer.replace(/,/g,"");justEvaluated=true;$("history").classList.remove("show");show();}); $("historyList").append(d); }); }
$("pad").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; if(b.dataset.num!==undefined) addNum(b.dataset.num); else if(b.dataset.op) addOp(b.dataset.op); else switch(b.dataset.action) { case "clear": expr="";justEvaluated=false;show();break; case "dot": if(justEvaluated){expr="";justEvaluated=false;} if(!/\d*\.\d*$/.test(expr.split(/[+\-*/()]/).pop())) expr+="."; show();break; case "back": expr=expr.slice(0,-1);justEvaluated=false;show();break; case "equals": equals();break; case "paren": { const opens=(expr.match(/\(/g)||[]).length, closes=(expr.match(/\)/g)||[]).length; if(justEvaluated){expr="";justEvaluated=false;} if(!expr || /[+\-*/(]$/.test(expr)) expr+="("; else if(opens>closes) expr+=")"; else expr+="×("; show(); break; } case "percent": expr+="%"; show();break; } });
$("historyBtn").onclick=()=>{$("history").classList.add("show");renderHistory();}; $("closeHistory").onclick=()=>$("history").classList.remove("show"); $("clearHistory").onclick=()=>{history=[];renderHistory();}; $("menuBtn").onclick=()=>alert("広告なし・課金なしのシンプル電卓です。表示テーマは端末の設定に自動で合わせます。");
document.addEventListener("keydown",e=>{ if(/^\d$/.test(e.key))addNum(e.key); else if(e.key===".")$("pad").querySelector('[data-action="dot"]').click(); else if(e.key==="+")addOp("+"); else if(e.key==="-")addOp("−"); else if(e.key==="*")addOp("×"); else if(e.key==="/"){e.preventDefault();addOp("÷");} else if(e.key==="Enter"||e.key==="=")equals(); else if(e.key==="Backspace")$("pad").querySelector('[data-action="back"]').click(); else if(e.key==="Escape")$("pad").querySelector('[data-action="clear"]').click(); });

show();
</script>
</body></html>
